name: Deploy to news-bot
on:
  push:
    branches: [main]
    paths:
      - 'news_bot/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH key setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.57.78.164 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy news_bot to VM
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no won3ho@34.57.78.164 "mkdir -p /home/won3ho/news_bot/news_bot"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            news_bot/main.py news_bot/collector.py news_bot/requirements.txt \
            won3ho@34.57.78.164:/home/won3ho/news_bot/news_bot/

      - name: Bootstrap and restart news bot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no won3ho@34.57.78.164 \
            "NHTOKEN='${{ secrets.NH_BOT_TOKEN }}' ANTKEY='${{ secrets.ANTHROPIC_API_KEY }}' bash -s" << 'ENDSSH'
          set -e
          DIR=/home/won3ho/news_bot/news_bot
          mkdir -p "$DIR"
          python3 -m pip --version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip)
          python3 -m pip install --quiet -r "$DIR/requirements.txt" \
            || python3 -m pip install --quiet --break-system-packages -r "$DIR/requirements.txt"
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=1633958343\nANTHROPIC_API_KEY=%s\nCHECK_INTERVAL_MINUTES=30\n' "$NHTOKEN" "$ANTKEY" > "$DIR/.env"
          chmod 600 "$DIR/.env"
          sudo tee /etc/systemd/system/news_bot.service >/dev/null <<UNIT
          [Unit]
          Description=NH News Bot
          After=network.target
          [Service]
          User=won3ho
          WorkingDirectory=$DIR
          ExecStart=/usr/bin/python3 main.py
          Restart=on-failure
          RestartSec=10
          Environment=PYTHONUNBUFFERED=1
          StandardOutput=append:/home/won3ho/bot.log
          StandardError=append:/home/won3ho/bot.log
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable news_bot
          sudo systemctl restart news_bot
          sleep 3
          sudo systemctl is-active news_bot && echo NEWSBOT_OK || echo NEWSBOT_FAIL
          ENDSSH

      - name: Send test message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.NH_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=1633958343" -d "text=뉴스봇 재배포 완료" > /dev/null
