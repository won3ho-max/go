name: 종목 일괄 추가

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '이름:종목명 (쉼표 구분). 예: 송지호:자화전자,조형오:티에이치엔'
        required: false
        type: string
      rename:
        description: '종목명 교정 — 이름:기존>새이름 (쉼표 구분). 예: 김동환:SKM>SK텔레콤'
        required: false
        type: string
      rec_date:
        description: '추천일 (YYYY-MM-DD, 비우면 이번주 월요일)'
        required: false
        type: string
      dry_run:
        description: '드라이런(읽기전용 확인만, 시트 변경 없음)'
        required: false
        default: true
        type: boolean
      allow_dup:
        description: '같은 종목이 이미 있어도 추가(재추천인 경우만 true)'
        required: false
        default: false
        type: boolean

defaults:
  run:
    working-directory: hantang

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --quiet gspread google-auth

      - name: 종목 추가
        env:
          GSHEETS_CREDENTIALS: ${{ secrets.GSHEETS_CREDENTIALS }}
          GSHEETS_ID:          ${{ secrets.GSHEETS_ID }}
          STOCKS:              ${{ inputs.stocks }}
          RENAME:              ${{ inputs.rename }}
          REC_DATE:            ${{ inputs.rec_date }}
          DRY_RUN:             ${{ inputs.dry_run }}
          ALLOW_DUP:           ${{ inputs.allow_dup }}
        run: python batch_add_stocks.py
