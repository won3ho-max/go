name: 한탕 스터디 데일리 리포트

on:
  # schedule 제거 — GitHub Actions cron이 최대 3시간까지 밀린다
  # (2026-08-07: 07:00 예정 → 10:30 시작). 정시 트리거는 GCP VM 크론이 맡는다.
  # 설치/제거/점검: install_daily_timer.yml 워크플로 참조.
  workflow_dispatch:
    inputs:
      test_mode:
        description: '테스트 모드 (개인 텔레그램으로 발송)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: hantang

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install --quiet \
            gspread google-auth \
            requests yfinance \
            Pillow python-dateutil \
            exchange_calendars

      - name: 주가 업데이트 + 카드뉴스 + 텔레그램
        env:
          GSHEETS_CREDENTIALS: ${{ secrets.GSHEETS_CREDENTIALS }}
          GSHEETS_ID:          ${{ secrets.GSHEETS_ID }}
          TELEGRAM_TOKEN:      ${{ secrets.HANTANG_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ inputs.test_mode == true && '1633958343' || secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 구글 시트가 5xx를 뿜는 날이 있다(2026-08-21·24, 09-04). 파이썬 안쪽
          # 재시도로도 못 버티면 몇 분 뒤 통째로 다시 돌린다. 카드는 발송 표식
          # (.card_sent_*)으로 중복 발송을 막으므로 재실행이 안전하다.
          for attempt in 1 2 3; do
            if python update_gsheets.py; then
              echo "::notice::데일리 성공 (시도 $attempt회차)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              WAIT=$((attempt * 180))
              echo "::warning::데일리 실패 — ${WAIT}초 뒤 재시도 ($attempt/3)"
              sleep "$WAIT"
            fi
          done
          echo "::error::3회 모두 실패"
          exit 1

      - name: 실패 알림
        if: failure()
        env:
          TOKEN: ${{ secrets.HANTANG_TELEGRAM_TOKEN }}
        run: |
          # 데일리가 죽으면 카드가 안 나가는데 아무도 모른다(2026-08-21·24 이틀 누락).
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id=1633958343 \
            --data-urlencode "text=🚨 데일리 리포트 실패 — 카드가 발송되지 않았습니다.
          실행 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
